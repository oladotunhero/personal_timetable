<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Timetable Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Personal Timetable Generator</h1>
        
        <!-- Subjects Section -->
        <h2>Subjects</h2>
        <div id="subjectsContainer">
            <div class="subject-input">
                <input type="text" placeholder="Subject name" class="subject-name" required>
                <button onclick="removeSubject(this)">Remove</button>
            </div>
        </div>
        <button onclick="addSubject()">Add Subject</button>

        <!-- Settings Section -->
        <h2>Settings</h2>
        <div class="time-slot">
            <label>Start time: </label>
            <input type="time" id="startTime" value="08:00" required>
            <label>End time: </label>
            <input type="time" id="endTime" value="14:00" required>
        </div>
        <div>
            <label>Break after (hours): </label>
            <input type="number" id="breakAfter" min="1" max="4" value="1" required>
        </div>
        <div>
            <label>Break duration (minutes): </label>
            <input type="number" id="breakDuration" min="15" max="30" value="15" required>
        </div>
        <div>
            <label>Days per week: </label>
            <select id="daysPerWeek">
                <option value="5">5 days</option>
                <option value="6">6 days</option>
                <option value="7">7 days</option>
            </select>
        </div>

        <!-- Action Buttons -->
        <button onclick="generate()">Generate Timetable</button>
        <button onclick="resetForm()" class="reset-button">Reset</button>
        <button onclick="downloadPDF()" class="download-button" id="downloadBtn" disabled>Download as PDF</button>

        <!-- Timetable -->
        <table id="timetable">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Monday</th>
                    <th>Tuesday</th>
                    <th>Wednesday</th>
                    <th>Thursday</th>
                    <th>Friday</th>
                    <th>Saturday</th>
                    <th>Sunday</th>
                </tr>
            </thead>
            <tbody>
                <!-- Timetable rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
